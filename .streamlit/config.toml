# Knowledge Assistant — Material Design 3 inspired theme
# Light + Dark modes enable the system/light/dark toggle in Streamlit settings

[theme]
font = "'Roboto':https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
codeFont = "'Roboto Mono':https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap"
codeFontSize = "14px"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [500, 500, 500, 500, 500, 500]
linkUnderline = false
baseRadius = "10px"
buttonRadius = "full"
showWidgetBorder = false
showSidebarBorder = true

# ── Light mode ────────────────────────────────────────────
[theme.light]
primaryColor = "#0b57d0"
backgroundColor = "#f8f9fa"
secondaryBackgroundColor = "#ffffff"
codeBackgroundColor = "#e8eaed"
textColor = "#1f1f1f"
linkColor = "#0b57d0"
borderColor = "#dadce0"
codeTextColor = "#1f1f1f"
chartCategoricalColors = ["#0b57d0", "#188038", "#a142f4", "#e37400", "#d93025", "#1a73e8", "#5f6368"]
blueColor = "#1a73e8"
greenColor = "#188038"
redColor = "#d93025"
orangeColor = "#e37400"
yellowColor = "#f9ab00"
violetColor = "#a142f4"
grayColor = "#5f6368"
dataframeBorderColor = "#dadce0"
dataframeHeaderBackgroundColor = "#f1f3f4"

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f3f4"
codeBackgroundColor = "#e8eaed"
textColor = "#1f1f1f"
borderColor = "#dadce0"

# ── Dark mode ─────────────────────────────────────────────
[theme.dark]
primaryColor = "#a8c7fa"
backgroundColor = "#1a1c1e"
secondaryBackgroundColor = "#252830"
codeBackgroundColor = "#2d3138"
textColor = "#e3e3e3"
linkColor = "#a8c7fa"
borderColor = "#444950"
codeTextColor = "#e3e3e3"
chartCategoricalColors = ["#a8c7fa", "#81c995", "#c58af9", "#fcad70", "#f28b82", "#8ab4f8", "#9aa0a6"]
blueColor = "#8ab4f8"
greenColor = "#81c995"
redColor = "#f28b82"
orangeColor = "#fcad70"
yellowColor = "#fdd663"
violetColor = "#c58af9"
grayColor = "#9aa0a6"
dataframeBorderColor = "#444950"
dataframeHeaderBackgroundColor = "#2d3138"

[theme.dark.sidebar]
backgroundColor = "#141518"
secondaryBackgroundColor = "#252830"
codeBackgroundColor = "#2d3138"
textColor = "#e3e3e3"
borderColor = "#444950"
